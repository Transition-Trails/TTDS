<!-- @dsCard group="Trail Kit" height=400 subtitle="Notebook edge tabs, doubling as PDF nav" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>*{box-sizing:border-box}body{margin:0}#root{padding:20px;background:var(--tt-bg);font-family:var(--tt-font-body);color:var(--tt-text)}</style>
</head>
<body>
<div id="root" class="trail-kit"></div>
<script>
(function(){
  var h = React.createElement;
  var C = window.TransitionTrailsDesignSystem_335df4.TabStrip;
  var libs = [];
  function load(i){
    if (i >= libs.length) { ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{height:330,display:'flex'}},h(C,{sections:['Orient','Prepare','Build','Verify','Next Trail'],active:2}))); return; }
    var s = document.createElement('script'); s.src = libs[i];
    s.onload = s.onerror = function(){ load(i + 1); };
    document.head.appendChild(s);
  }
  load(0);
})();
</script>
</body>
</html>
