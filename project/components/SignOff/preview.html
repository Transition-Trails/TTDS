<script>
(function(){
  var h = React.createElement;
  var C = window.TransitionTrailsDesignSystem_335df4.SignOff;
  var libs = [];
  function load(i){
    if (i >= libs.length) { ReactDOM.createRoot(document.getElementById('root')).render(h(C,{evidence:['Completed verification log with dates','Scope sheet approved by the partner','Announcement email as sent']})); return; }
    var s = document.createElement('script'); s.src = libs[i];
    s.onload = s.onerror = function(){ load(i + 1); };
    document.head.appendChild(s);
  }
  load(0);
})();
</script>
