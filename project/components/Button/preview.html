<div id="root"></div>
<script>
(function(){
  var h = React.createElement;
  var C = window.TransitionTrailsDesignSystem_335df4.Button;
  var libs = [];
  function load(i){
    if (i >= libs.length) { ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'flex',gap:14,flexWrap:'wrap',alignItems:'center'}},
  h(C,{variant:'primary'},'Find your Trail'),
  h(C,{variant:'secondary'},'Support the Mission'),
  h(C,{variant:'amber'},'Take the Next Step \u2192'),
  h(C,{variant:'ghost'},'View All Trails \u2192'),
  h(C,{disabled:true},'Disabled'))); return; }
    var s = document.createElement('script'); s.src = libs[i];
    s.onload = s.onerror = function(){ load(i + 1); };
    document.head.appendChild(s);
  }
  load(0);
})();
</script>
</body>
</html>
