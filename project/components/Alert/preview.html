<body>
<div id="root"></div>
<script>
(function(){
  var h = React.createElement;
  var C = window.TransitionTrailsDesignSystem_335df4.Alert;
  var libs = [];
  function load(i){
    if (i >= libs.length) { ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'flex',flexDirection:'column',gap:10}},
  h(C,{tone:'success',title:'Success'},'Your application has been received. Welcome to the trail!'),
  h(C,{tone:'warning',title:'Heads up'},'Enrollment closes in 3 days.'))); return; }
    var s = document.createElement('script'); s.src = libs[i];
    s.onload = s.onerror = function(){ load(i + 1); };
    document.head.appendChild(s);
  }
  load(0);
})();
</script>
</body>
