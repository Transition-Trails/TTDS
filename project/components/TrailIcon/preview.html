<div id="root" class="trail-kit"></div>
<script>
(function(){
  var h = React.createElement;

  var libs = ["https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"];
  function load(i){

  [['lightbulb','Pro tip'],['triangle-alert','Watch out'],['award','Best practice'],['compass','Coach'],['list-checks','Checklist'],['key-round','Access'],['circle-check-big','Proof'],['rotate-ccw','Rollback']].map(function(p){

  }))); return; }
    var s = document.createElement('script'); s.src = libs[i];
    s.onload = s.onerror = function(){ load(i + 1); };
