<!-- @dsCard group="Colors" viewport="700x190" name="Neutrals" subtitle="Trail Light · Warm Gray · Slate · Charcoal" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--tt-bg);font-family:var(--tt-font-body)}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.sw{border-radius:var(--tt-radius-md);overflow:hidden;border:1px solid var(--tt-border)}.chip{height:70px}.meta{padding:8px 10px;background:#fff}.nm{font-family:var(--tt-font-heading);font-weight:600;font-size:12.5px;color:var(--tt-heading)}.hx{font-size:11px;color:var(--tt-slate)}.rl{font-size:10.5px;color:#8a908d}</style>
</head><body><div class="row">
<div class="sw"><div class="chip" style="background:#FAFAF7"></div><div class="meta"><div class="nm">Trail Light</div><div class="hx">#FAFAF7</div><div class="rl">Main bg</div></div></div>
<div class="sw"><div class="chip" style="background:#E2E4E1"></div><div class="meta"><div class="nm">Warm Gray</div><div class="hx">#E2E4E1</div><div class="rl">Borders</div></div></div>
<div class="sw"><div class="chip" style="background:#4A4F4D"></div><div class="meta"><div class="nm">Slate</div><div class="hx">#4A4F4D</div><div class="rl">Body text</div></div></div>
<div class="sw"><div class="chip" style="background:#2A2E2C"></div><div class="meta"><div class="nm">Charcoal</div><div class="hx">#2A2E2C</div><div class="rl">Headings</div></div></div>
<div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="nm">White</div><div class="hx">#FFFFFF</div><div class="rl">Surface</div></div></div>
</div></body></html>
