<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & Elevation" subtitle="Soft corners · low-contrast shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--tt-bg);font-family:var(--tt-font-body);display:flex;gap:22px;align-items:center}.box{width:96px;height:64px;background:#fff;border:1px solid var(--tt-border);display:flex;align-items:center;justify-content:center;font-family:var(--tt-font-heading);font-weight:600;font-size:12px;color:var(--tt-heading)}.cap{font-size:11px;color:#8a908d;text-align:center;margin-top:6px}.w{text-align:center}</style>
</head><body>
<div class="w"><div class="box" style="border-radius:8px">sm</div><div class="cap">8px</div></div>
<div class="w"><div class="box" style="border-radius:14px">md</div><div class="cap">14px</div></div>
<div class="w"><div class="box" style="border-radius:22px">lg</div><div class="cap">22px</div></div>
<div class="w"><div class="box" style="border-radius:999px">pill</div><div class="cap">999px</div></div>
<div class="w" style="margin-left:14px"><div class="box" style="border-radius:14px;border:none;box-shadow:0 6px 16px rgba(42,46,44,.08)">soft</div><div class="cap">shadow-soft</div></div>
<div class="w"><div class="box" style="border-radius:14px;border:none;box-shadow:0 12px 28px rgba(42,46,44,.10)">card</div><div class="cap">shadow-card</div></div>
</body></html>
