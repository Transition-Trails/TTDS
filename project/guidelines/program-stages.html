<!-- @dsCard group="Colors" viewport="700x270" name="Program Stage Colors" subtitle="One per trail — Foundations · Guided · Mastery" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--tt-doc);font-family:var(--tt-font-body)}.row{display:grid;grid-template-columns:repeat(3,1fr) 1.1fr;gap:0;border-radius:var(--tt-radius-md);overflow:hidden;border:1px solid var(--tt-doc-rule)}.chip{height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:11px;color:#fff}.t{font-family:var(--tt-font-heading);font-weight:600;font-size:12.5px}.h{font-size:11px;opacity:.85}.note{padding:12px 14px;background:#fff;font-size:11.5px;line-height:1.5;color:var(--tt-slate);display:flex;align-items:center}</style>
</head><body><div class="row">
<div class="chip" style="background:#2F6F7E"><div class="t">Foundations Trail</div><div class="h">#2F6F7E · Deep Teal</div></div>
<div class="chip" style="background:#2F6B3F"><div class="t">Guided Trail</div><div class="h">#2F6B3F · Trail Green</div></div>
<div class="chip" style="background:#2A2E2C"><div class="t">Trail of Mastery</div><div class="h">#2A2E2C · Charcoal</div></div>
<div class="note">Set the stage with <code>.program-trail.is-guided</code>. The band color is how a learner knows which trail a page belongs to. <b>No Clay, no Amber</b> in program material.</div>
</div></body></html>
