<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--tt-paper);font-family:var(--tt-font-body)}.row{display:grid;grid-template-columns:repeat(4,1fr) 1.1fr;gap:0;border-radius:var(--tt-radius-md);overflow:hidden;border:1px solid var(--tt-rule)}.chip{height:88px;display:flex;align-items:flex-end;padding:10px}.t{font-family:var(--tt-font-heading);font-weight:600;font-size:12.5px}.note{padding:12px 14px;background:#fff;font-size:11.5px;line-height:1.5;color:var(--tt-slate);display:flex;align-items:center}</style>
</head><body><div class="row">
<div class="chip" style="background:#F7EAE3;color:#8A3D1C"><div><div class="t">Clay 100</div>#F7EAE3</div></div>
<div class="chip" style="background:#DFA285;color:#8A3D1C"><div><div class="t">Clay 300</div>#DFA285</div></div>
<div class="chip" style="background:#B4552D;color:#fff"><div><div class="t">Clay 500</div>#B4552D</div></div>
<div class="chip" style="background:#8A3D1C;color:#fff"><div><div class="t">Clay 700</div>#8A3D1C</div></div>
<div class="note">Appears <b>only</b> in Trail Kits, so a kit is recognizable across a desk. Deep Teal leads the kit; Sun Amber is reserved for the single Next&nbsp;Trail CTA.</div>
</div></body></html>
