<!-- @dsCard group="Colors" viewport="700x150" name="Trail Kit — Paper Surfaces" subtitle="Warm ground, marginalia rail & hairline rules" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--tt-paper);font-family:var(--tt-font-body)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.sw{border-radius:var(--tt-radius-md);overflow:hidden;border:1px solid var(--tt-rule)}.chip{height:64px}.meta{padding:8px 10px;background:#fff}.nm{font-family:var(--tt-font-heading);font-weight:600;font-size:12.5px;color:var(--tt-heading)}.hx{font-size:11px;color:var(--tt-slate)}.rl{font-size:10.5px;color:#8C857A}</style>
</head><body><div class="row">
<div class="sw"><div class="chip" style="background:#FBF7F0"></div><div class="meta"><div class="nm">Paper</div><div class="hx">#FBF7F0</div><div class="rl">Notebook ground</div></div></div>
<div class="sw"><div class="chip" style="background:#F3EDE2"></div><div class="meta"><div class="nm">Paper Alt</div><div class="hx">#F3EDE2</div><div class="rl">Side rail, tabs</div></div></div>
<div class="sw"><div class="chip" style="background:#DED5C7"></div><div class="meta"><div class="nm">Rule</div><div class="hx">#DED5C7</div><div class="rl">Note lines</div></div></div>
<div class="sw"><div class="chip" style="background:#C4B8A5"></div><div class="meta"><div class="nm">Rule Strong</div><div class="hx">#C4B8A5</div><div class="rl">Section rules</div></div></div>
</div></body></html>
