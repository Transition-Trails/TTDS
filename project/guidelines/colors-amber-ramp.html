<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--tt-bg);font-family:var(--tt-font-body)}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-radius:var(--tt-radius-md);overflow:hidden;border:1px solid var(--tt-border)}.chip{height:88px;display:flex;align-items:flex-end;padding:10px}.t{font-family:var(--tt-font-heading);font-weight:600;font-size:12.5px}</style>
</head><body><div class="row">
<div class="chip" style="background:#FFF3E0;color:#CC8400"><div><div class="t">Amber 100</div>#FFF3E0</div></div>
<div class="chip" style="background:#FFD08A;color:#CC8400"><div><div class="t">Amber 300</div>#FFD08A</div></div>
<div class="chip" style="background:#F5A623;color:#2A2E2C"><div><div class="t">Amber 500</div>#F5A623</div></div>
<div class="chip" style="background:#CC8400;color:#fff"><div><div class="t">Amber 700</div>#CC8400</div></div>
<div class="chip" style="background:#EDF5F8;color:#2F6F7E"><div><div class="t">Sky 100</div>#EDF5F8</div></div>
</div></body></html>
