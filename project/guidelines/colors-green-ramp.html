<div class="chip" style="background:#9FC3AE;color:#245531"><div><div class="t">300</div>#9FC3AE</div></div>
<div class="chip" style="background:#2F6B3F;color:#fff"><div><div class="t">500</div>#2F6B3F</div></div>
<div class="chip" style="background:#245531;color:#fff"><div><div class="t">700</div>#245531</div></div>
</div></body></html>
