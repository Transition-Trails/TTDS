</head><body><div id="root"></div>
<script type="text/babel" src="./SiteChrome.jsx"></script>
<script type="text/babel" src="./Home.jsx"></script>
<script type="text/babel" src="./Programs.jsx"></script>
<script type="text/babel" src="./GetInvolved.jsx"></script>
<script type="text/babel">
const { useState } = React;
function App() {
  const { Header, Footer } = window.TT_Site;
  const [screen, setScreen] = useState('home');
  const nav = (s) => { setScreen(s); window.scrollTo({ top: 0 }); };
  const Screen = { home: window.TT_Home, programs: window.TT_Programs, involved: window.TT_GetInvolved }[screen] || window.TT_Home;
  return (
    <div>
      <Header current={screen} onNav={nav} />
      <Screen onNav={nav} />
      <Footer onNav={nav} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
